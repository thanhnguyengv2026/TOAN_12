        .check-btn { background-color: #0284c7; color: white; font-weight: bold; padding: 10px 24px; border-radius: 8px; transition: background 0.2s; }
        .check-btn:hover:not(:disabled) { background-color: #0369a1; }
        .check-btn:disabled { opacity: 0.6; cursor: not-allowed; }

                        <div class="flex flex-col md:flex-row items-center gap-4 mt-6">
                            <input type="text" id="answerInput_${index}" class="answer-input shadow-sm" placeholder="Nhập đáp án..." autocomplete="off" ${ans !== null ? 'disabled' : ''} value="${ans ? ans.userAnswer : ''}">
                            ${ans === null ? `<button onclick="checkShort(${index})" class="check-btn shadow-md whitespace-nowrap">Kiểm tra kết quả</button>` : ''}
                        </div>
                    `;
                    if (ans !== null) {
                        html += `
                            <div class="mt-8 p-5 rounded-xl border shadow-sm ${ans.isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}">
                                <h4 class="font-bold text-lg mb-2 ${ans.isCorrect ? 'text-green-800' : 'text-red-800'}">${ans.isCorrect ? '✓ BẠN ĐÃ TRẢ LỜI ĐÚNG!' : '✗ LỰA CHỌN SAI!'}</h4>
                                ${!ans.isCorrect ? `<p class="mb-3 font-semibold text-gray-700">Đáp án đúng là: <span class="text-blue-700">${q.correctAnswers[0]}</span></p>` : ''}
                                <hr class="my-3 border-gray-300"><h4 class="font-bold text-gray-800 mb-2">Lời giải chi tiết:</h4><p class="text-gray-700">${q.explanation}</p>
                            </div>
                        `;
                    }
                }
                html += `</div>`;
            });
            
            appContainer.innerHTML = html;
            
            // Xóa loading và render toán
            renderMathInElement(appContainer, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ],
                throwOnError: false
            });
        }

        window.selectMCQ = function(qIndex, optIndex) {
            if (answersState[currentPart][qIndex]) return;
            answersState[currentPart][qIndex] = { selected: optIndex, isCorrect: (optIndex === currentQuestions[qIndex].correct) };
            updateScore(); renderAllQuestions();
        }

        window.selectTF = function(qIndex, sIndex, userChoice) {
            if (answersState[currentPart][qIndex][sIndex] !== null) return;
            answersState[currentPart][qIndex][sIndex] = (userChoice === currentQuestions[qIndex].statements[sIndex].correct);
            updateScore(); renderAllQuestions();
        }

        window.checkShort = function(qIndex) {
            const inputVal = document.getElementById(`answerInput_${qIndex}`).value.trim();
            if (inputVal === "") return alert("Vui lòng nhập đáp án!");
            const normalizedInput = inputVal.replace(/\s/g, '').replace(',', '.').toLowerCase();
            let isCorrect = currentQuestions[qIndex].correctAnswers.some(ans => normalizedInput === ans.replace(/\s/g, '').replace(',', '.').toLowerCase());
            answersState[currentPart][qIndex] = { userAnswer: inputVal, isCorrect: isCorrect };
            updateScore(); renderAllQuestions();
        }

        // Khởi động giao diện
        renderAllQuestions();
    </script>
</body>
</html>
