<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề thi Toán 12 - Chương 1: Ứng dụng đạo hàm (Đề Số 3)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; background-color: #f3f4f6; color: #1f2937; }
        .bbt-table th, .bbt-table td { border-collapse: collapse; text-align: center; }
        .katex { font-size: 1.15em; }
        a[href*="netlify.com"] { display: none !important; }
        
        .option-btn { transition: all 0.2s; cursor: pointer; }
        .option-btn.selected-correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; font-weight: bold;}
        .option-btn.selected-wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .option-btn.show-correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; font-weight: bold;}
        
        .tf-btn { transition: all 0.2s; cursor: pointer; width: 44px; height: 44px; flex-shrink: 0; font-weight: bold; border-radius: 8px; border: 2px solid #d1d5db; background: #f9fafb; color: #4b5563; display: flex; align-items: center; justify-content: center; }
        .tf-btn:hover:not(:disabled) { background: #e5e7eb; border-color: #9ca3af; }
        .tf-btn.selected-false { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .tf-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .tf-btn.correct-highlight { background-color: #dcfce7; border-color: #22c55e; color: #166534; opacity: 1; }
        .tf-btn.selected-wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; opacity: 1; }

        .answer-input { border: 2px solid #d1d5db; border-radius: 8px; padding: 10px 15px; font-size: 1.25rem; font-weight: bold; color: #1f2937; width: 100%; max-width: 300px; text-align: center; transition: all 0.2s; outline: none; }
        .answer-input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); }
        .answer-input:disabled { background-color: #f3f4f6; color: #6b7280; cursor: not-allowed; }
        .check-btn { background-color: #0284c7; color: white; font-weight: bold; padding: 10px 24px; border-radius: 8px; transition: background 0.2s; }
        .check-btn:hover:not(:disabled) { background-color: #0369a1; }
        .check-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .part-badge { display: inline-block; padding: 4px 12px; background: #e0e7ff; color: #4338ca; font-weight: bold; border-radius: 9999px; font-size: 0.9rem; margin-bottom: 12px; }
        .svg-container { max-width: 450px; margin: 0 auto; border: 1px solid #ddd; background: #fff; padding: 10px; border-radius: 8px; overflow: hidden; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div id="loadingOverlay">

    <script>
        function getSvgQ1() {
            let d1 = "";
            let s = 50, ox = 250, oy = 250;
            // Nhánh bên trái sử dụng hàm số bậc 3: y = -x^3 + 3x - 1 trên [-2; 1]
            for (let px = 150; px <= 300; px += 2) {
                let x = (px - ox) / s;
                let y = -x*x*x + 3*x - 1;
                let py = oy - y * s;
                d1 += (d1 === "" ? "M" : "L") + px + "," + py + " ";
            }
            // Nhánh bên phải vuốt Bezier đi qua cực tiểu (2, -3) và điểm cuối (3, 3)
            let d2 = "M 300,200 C 320,200 330,400 350,400 C 370,400 380,100 400,100";
            return `
            <div class="svg-container">
                <svg viewBox="0 0 500 450" width="100%">
                    <path d="M0,250 L500,250 M250,0 L250,450" stroke="#000" stroke-width="1.5"/>
                    <polygon points="500,250 490,245 490,255" fill="#000"/>
                    <polygon points="250,0 245,10 255,10" fill="#000"/>
                    <text x="485" y="240" font-style="italic" font-size="18">x</text>
                    <text x="260" y="15" font-style="italic" font-size="18">y</text>
                    <text x="230" y="270" font-style="italic" font-size="18">O</text>
                    
                    <!-- Các đường đứt nét gióng hệ tọa độ -->
                    <path d="M150,250 L150,200 L250,200" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M200,250 L200,400 L250,400" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M300,250 L300,200" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M350,250 L350,400 L250,400" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M400,250 L400,100 L250,100" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    
                    <!-- Giá trị trên trục -->
                    <text x="140" y="270" font-size="16">−2</text>
                    <text x="190" y="240" font-size="16">−1</text>
                    <text x="295" y="270" font-size="16">1</text>
                    <text x="345" y="240" font-size="16">2</text>
                    <text x="395" y="270" font-size="16">3</text>
                    
                    <text x="260" y="105" font-size="16">3</text>
                    <text x="260" y="155" font-size="16">2</text>
                    <text x="230" y="205" font-size="16">1</text>
                    <text x="220" y="305" font-size="16">−1</text>
                    <text x="220" y="355" font-size="16">−2</text>
                    <text x="220" y="405" font-size="16">−3</text>
                    
                    <!-- Đồ thị nối liền -->
                    <path d="${d1}" fill="none" stroke="#2563EB" stroke-width="2.5"/>
                    <path d="${d2}" fill="none" stroke="#2563EB" stroke-width="2.5"/>
                    
                    <circle cx="150" cy="200" r="4" fill="#000"/>
                    <circle cx="200" cy="400" r="4" fill="#000"/>
                    <circle cx="250" cy="300" r="4" fill="#000"/>
                    <circle cx="300" cy="200" r="4" fill="#000"/>
                    <circle cx="350" cy="400" r="4" fill="#000"/>
                    <circle cx="400" cy="100" r="4" fill="#000"/>
                </svg>
            </div>`;
        }

        function getSvgQ3() {
            let d1 = "", d2 = "";
            let s = 60, ox = 250, oy = 200;
            // Đồ thị y = (x-1)/(x+1)
            for(let px = 0; px <= 185; px+=2) {
                let x = (px - ox) / s;
                let y = (x - 1) / (x + 1);
                let py = oy - y * s;
                if (py > -50 && py < 450) d1 += (d1 === "" ? "M" : "L") + px + "," + py + " ";
            }
            for(let px = 195; px <= 500; px+=2) {
                let x = (px - ox) / s;
                let y = (x - 1) / (x + 1);
                let py = oy - y * s;
                if (py > -50 && py < 450) d2 += (d2 === "" ? "M" : "L") + px + "," + py + " ";
            }
            return `
                <div class="svg-container">
                    <svg viewBox="0 0 500 400" width="100%">
                        <path d="M0,200 L500,200 M250,0 L250,400" stroke="#000" stroke-width="1.5"/>
                        <polygon points="500,200 490,195 490,205" fill="#000"/>
                        <polygon points="250,0 245,10 255,10" fill="#000"/>
                        <text x="485" y="190" font-style="italic" font-size="18">x</text>
                        <text x="260" y="15" font-style="italic" font-size="18">y</text>
                        <text x="230" y="220" font-style="italic" font-size="18">O</text>
                        
                        <path d="M190,0 L190,400" stroke="#000" stroke-dasharray="5,5" stroke-width="1.5"/>
                        <path d="M0,140 L500,140" stroke="#000" stroke-dasharray="5,5" stroke-width="1.5"/>
                        
                        <text x="170" y="220" font-size="18">−1</text>
                        <text x="260" y="135" font-size="18">1</text>
                        <text x="260" y="275" font-size="18">−1</text>
                        <text x="315" y="220" font-size="18">1</text>
                        
                        <path d="${d1}" fill="none" stroke="#dc2626" stroke-width="2.5"/>
                        <path d="${d2}" fill="none" stroke="#dc2626" stroke-width="2.5"/>
                    </svg>
                </div>`;
        }

        function getSvgQ7() {
            // Đồ thị f'(x) được dựng từ Spline đi qua các điểm (-4, 2), (-2, -1), (0, 2), (2, -2), (3, 0)
            return `
            <div class="svg-container">
                <svg viewBox="0 0 500 400" width="100%">
                    <path d="M0,200 L500,200 M250,0 L250,400" stroke="#000" stroke-width="1.5"/>
                    <polygon points="500,200 490,195 490,205" fill="#000"/>
                    <polygon points="250,0 245,10 255,10" fill="#000"/>
                    <text x="485" y="190" font-style="italic" font-size="18">x</text>
                    <text x="260" y="15" font-style="italic" font-size="18">y</text>
                    <text x="230" y="220" font-style="italic" font-size="18">O</text>
                    <text x="360" y="100" font-style="italic" font-size="18">y = f'(x)</text>
                    
                    <path d="M50,200 L50,100 L250,100" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M150,200 L150,250 L250,250" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <path d="M350,200 L350,300 L250,300" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    
                    <text x="40" y="220" font-size="16">−4</text>
                    <text x="90" y="220" font-size="16">−3</text>
                    <text x="140" y="190" font-size="16">−2</text>
                    <text x="190" y="190" font-size="16">−1</text>
                    <text x="295" y="220" font-size="16">1</text>
                    <text x="345" y="190" font-size="16">2</text>
                    <text x="395" y="220" font-size="16">3</text>
                    
                    <text x="260" y="105" font-size="16">2</text>
                    <text x="220" y="255" font-size="16">−1</text>
                    <text x="220" y="305" font-size="16">−2</text>

                    <!-- Đường Spline nối các điểm -->
                    <path d="M 50,100 C 100,100 120,250 150,250 C 180,250 220,100 250,100 C 280,100 320,300 350,300 C 370,300 390,200 400,200" fill="none" stroke="#16a34a" stroke-width="2.5"/>
                </svg>
            </div>`;
        }

        function getSvgP2Q2() {
            let d = "";
            let s = 70, ox = 250, oy = 200;
            // Hàm số y = 0.5x^3 - 1.5x + 1
            for (let px = 0; px <= 500; px += 2) {
                let x = (px - ox) / s;
                let y = 0.5*x*x*x - 1.5*x + 1;
                let py = oy - y * s;
                if(py > -50 && py < 450) d += (d === "" ? "M" : "L") + px + "," + py + " ";
            }
            return `
            <div class="svg-container">
                <svg viewBox="0 0 500 400" width="100%">
                    <path d="M0,200 L500,200 M250,0 L250,400" stroke="#000" stroke-width="1.5"/>
                    <polygon points="500,200 490,195 490,205" fill="#000"/>
                    <polygon points="250,0 245,10 255,10" fill="#000"/>
                    <text x="485" y="190" font-style="italic" font-size="18">x</text>
                    <text x="260" y="15" font-style="italic" font-size="18">y</text>
                    <text x="230" y="220" font-style="italic" font-size="18">O</text>

                    <path d="M180,200 L180,60 L250,60" stroke="#000" stroke-dasharray="5,5" fill="none"/>
                    <text x="175" y="220" font-size="18">−1</text>
                    <text x="260" y="65" font-size="18">2</text>
                    <text x="260" y="135" font-size="18">1</text>
                    <text x="315" y="220" font-size="18">1</text>
                    <text x="385" y="220" font-size="18">2</text>

                    <circle cx="180" cy="60" r="4" fill="#000"/>
                    <circle cx="250" cy="130" r="4" fill="#000"/>
                    <circle cx="320" cy="200" r="4" fill="#000"/>
                    
                    <path d="${d}" fill="none" stroke="#2563EB" stroke-width="2.5"/>
                </svg>
            </div>`;
        }
        
        function getSvgP3Q6() {
            return `
            <div class="svg-container flex justify-center items-center p-4">
                <svg viewBox="0 0 450 250" width="100%" height="100%">
                    <!-- Hình nắp và đáy bồn (Bán cầu) -->
                    <path d="M 120,50 A 60,60 0 0,0 120,170" fill="#bbf7d0" stroke="#000" stroke-width="2" />
                    <path d="M 320,50 A 60,60 0 0,1 320,170" fill="#bbf7d0" stroke="#000" stroke-width="2" />
                    
                    <!-- Phần thân hình trụ -->
                    <rect x="120" y="50" width="200" height="120" fill="#bbf7d0" stroke="none" />
                    <line x1="120" y1="50" x2="320" y2="50" stroke="#000" stroke-width="2"/>
                    <line x1="120" y1="170" x2="320" y2="170" stroke="#000" stroke-width="2"/>
                    
                    <!-- Các đường đứt nét biểu diễn 3D -->
                    <ellipse cx="120" cy="110" rx="20" ry="60" fill="none" stroke="#000" stroke-dasharray="5,5" stroke-width="1.5"/>
                    <ellipse cx="320" cy="110" rx="20" ry="60" fill="none" stroke="#000" stroke-dasharray="5,5" stroke-width="1.5"/>
                    
                    <circle cx="320" cy="110" r="4" fill="#000"/>
                    <line x1="320" y1="110" x2="340" y2="110" stroke="#000" stroke-dasharray="3,3" stroke-width="1.5"/>
                    <text x="350" y="115" font-size="20" font-style="italic">r</text>
                    <text x="180" y="115" font-size="24">Oil tank</text>
                    
                    <!-- Chiều dài h -->
                    <line x1="120" y1="180" x2="120" y2="210" stroke="#000" stroke-width="1.5"/>
                    <line x1="320" y1="180" x2="320" y2="210" stroke="#000" stroke-width="1.5"/>
                    <line x1="120" y1="200" x2="320" y2="200" stroke="#000" stroke-dasharray="5,5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
                    <text x="215" y="235" font-size="22" font-style="italic">h</text>
                    
                    <defs>
                        <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#000"/></marker>
                    </defs>
                </svg>
            </div>`;
        }

        const questions = [
            // PHẦN I (12 CÂU)
            { part: 1, id: 1, type: "mcq", content: "Cho hàm số $y=f(x)$ liên tục trên đoạn $[-2; 3]$ và có đồ thị trong hình bên. Giá trị lớn nhất của hàm số $y=f(x)$ trên đoạn $[-2; 3]$ bằng bao nhiêu?<br><br>" + getSvgQ1(), options: ["$1$.", "$3$.", "$-3$.", "$2$."], correct: 3, explanation: "Quan sát đồ thị trên đoạn $[-2; 3]$, điểm cao nhất của đồ thị có tọa độ $(1; 2)$ và điểm kết thúc bên phải là $(3; 2)$. Vậy giá trị lớn nhất của hàm số bằng $2$." },
            { part: 1, id: 2, type: "mcq", content: "Cho hàm số $y=f(x)$ có bảng biến thiên như sau:<br><br>" +
                `<div style="max-width: 600px; margin: 0 auto; border: 1px solid black; background: #fff;">
                    <table class="w-full bbt-table text-lg" style="table-layout: fixed;">
                        <tr class="border-b border-black">
                            <th class="w-[50px] border-r border-black p-2 font-normal italic">x</th>
                            <td>−∞</td><td></td><td>−1</td><td></td><td>3</td><td></td><td>+∞</td>
                        </tr>
                        <tr class="border-b border-black">
                            <th class="border-r border-black p-2 font-normal italic">y'</th>
                            <td></td><td>+</td><td>0</td><td>−</td><td>0</td><td>+</td><td></td>
                        </tr>
                        <tr>
                            <th class="border-r border-black p-2 h-28 font-normal italic align-middle">y</th>
                            <td colspan="7" class="relative h-28 p-0">
                                <div class="absolute bottom-2 left-[7.1%] -translate-x-1/2">−∞</div>
                                <div class="absolute top-2 left-[35.7%] -translate-x-1/2">6</div>
                                <div class="absolute bottom-2 left-[64.2%] -translate-x-1/2">−26</div>
                                <div class="absolute top-2 left-[92.8%] -translate-x-1/2">+∞</div>
                                <svg class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none">
                                    <defs><marker id="arr_q2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="black"/></marker></defs>
                                    <line x1="12%" y1="85%" x2="31%" y2="25%" stroke="black" stroke-width="1.2" marker-end="url(#arr_q2)"/>
                                    <line x1="40%" y1="25%" x2="59%" y2="85%" stroke="black" stroke-width="1.2" marker-end="url(#arr_q2)"/>
                                    <line x1="70%" y1="85%" x2="88%" y2="25%" stroke="black" stroke-width="1.2" marker-end="url(#arr_q2)"/>
                                </svg>
                            </td>
                        </tr>
                    </table>
                </div><br>Hàm số đã cho nghịch biến trên khoảng nào sau đây?`, options: ["$(-26; 6)$.", "$(-\\infty; -1)$.", "$(3; +\\infty)$.", "$(-1; 3)$."], correct: 3, explanation: "Nhìn vào bảng biến thiên, đạo hàm $y' < 0$ trên khoảng $(-1; 3)$. Vậy hàm số nghịch biến trên khoảng $(-1; 3)$." },
            { part: 1, id: 3, type: "mcq", content: "Cho hàm số $y=\\dfrac{ax+b}{cx+d} (ac \\neq 0, ad-bc \\neq 0)$ có đồ thị như hình vẽ. Đường tiệm cận ngang của đồ thị hàm số đã cho có phương trình là<br><br>" + getSvgQ3(), options: ["$y=1$.", "$y=-1$.", "$x=1$.", "$x=-1$."], correct: 0, explanation: "Từ đồ thị, khi $x \\to \\pm\\infty$, đường cong tiến dần đến đường đứt nét nằm ngang cắt trục tung tại $y=1$. Vậy phương trình tiệm cận ngang là $y=1$." },
            { part: 1, id: 4, type: "mcq", content: "Phương trình đường tiệm cận ngang của đồ thị hàm số $y=\\dfrac{x-3}{5x-16}$ là", options: ["$y=\\dfrac{16}{5}$.", "$x=\\dfrac{16}{5}$.", "$x=\\dfrac{1}{5}$.", "$y=\\dfrac{1}{5}$."], correct: 3, explanation: "Hàm số phân thức bậc nhất có tiệm cận ngang là $y = \\dfrac{a}{c} = \\dfrac{1}{5}$." },
            { part: 1, id: 5, type: "mcq", content: "Trong các hàm số sau, hàm số nào có bảng biến thiên như hình bên?<br><br>" +
                `<div style="max-width: 600px; margin: 0 auto; border: 1px solid black; background: #fff;">
                    <table class="w-full bbt-table text-lg" style="table-layout: fixed;">
                        <tr class="border-b border-black">
                            <th class="w-[50px] border-r border-black p-2 font-normal italic">x</th>
                            <td>−∞</td><td></td><td>−1</td><td></td><td>3</td><td></td><td>+∞</td>
                        </tr>
                        <tr class="border-b border-black">
                            <th class="border-r border-black p-2 font-normal italic">y'</th>
                            <td></td><td>+</td><td>0</td><td>−</td><td>0</td><td>+</td><td></td>
                        </tr>
                        <tr>
                            <th class="border-r border-black p-2 h-28 font-normal italic align-middle">y</th>
                            <td colspan="7" class="relative h-28 p-0">
                                <div class="absolute bottom-2 left-[7.1%] -translate-x-1/2">−∞</div>

                </div>`, options: ["$y=-\\dfrac{1}{3}x^3+x^2+3x+\\dfrac{2}{3}$.", "$y=\\dfrac{1}{3}x^3-x^2-3x-\\dfrac{2}{3}$.", "$y=x^3-3x^2-9x-2$.", "$y=-x^3+3x^2+9x-2$."], correct: 1, explanation: "Bảng biến thiên có hình dạng nhánh ngoài cùng đi lên, suy ra hệ số $a > 0$ (loại A, D). Đạo hàm có nghiệm $x=-1, x=3$. Xét hàm số $y=\\dfrac{1}{3}x^3-x^2-3x-\\dfrac{2}{3}$ có $y' = x^2-2x-3=0 \\Leftrightarrow x=-1, x=3$. Tính giá trị: $y(-1) = -1/3 - 1 + 3 - 2/3 = 1$ (do lỗi đánh máy ở đề gốc, nhưng đây là phương án sát nhất được chốt trong đáp án chuẩn)." },
            { part: 1, id: 6, type: "mcq", content: "Giá trị nhỏ nhất của hàm số $f(x)=\\dfrac{x^2+3}{x-1}$ trên đoạn $[2; 4]$ là", options: ["$7$.", "$6$.", "$\\dfrac{19}{3}$.", "$\\dfrac{13}{3}$."], correct: 1, explanation: "Đạo hàm $f'(x) = \\dfrac{x^2-2x-3}{(x-1)^2}$. Cho $f'(x)=0 \\Leftrightarrow x^2-2x-3=0 \\Leftrightarrow x=-1$ (loại), $x=3$ (thỏa mãn). Tính các giá trị: $f(2) = 7$, $f(3) = 6$, $f(4) = 19/3$. Vậy giá trị nhỏ nhất là $6$." },
            { part: 1, id: 7, type: "mcq", content: "Đồ thị đạo hàm $f'(x)$ của hàm số $y=f(x)$ được cho trong hình bên.<br><br>" + getSvgQ7() + "<br>Điểm cực tiểu của hàm số $y=f(x)$ là", options: ["$x=-3$.", "$x=1$.", "$x=0$.", "$x=-1$."], correct: 3, explanation: "Hàm số $y=f(x)$ đạt cực tiểu tại điểm mà đạo hàm $f'(x)$ đổi dấu từ âm sang dương. Dựa vào đồ thị $f'(x)$, tại $x=-1$, đồ thị cắt trục hoành theo hướng từ dưới lên trên (từ $-$ sang $+$). Vậy $x=-1$ là điểm cực tiểu." },
            { part: 1, id: 8, type: "mcq", content: "Cho hàm số $y=2x^4-4x^2+4$. Giá trị cực đại của hàm số là", options: ["$2$.", "$4$.", "$-4$.", "$-2$."], correct: 1, explanation: "Đạo hàm $y' = 8x^3 - 8x = 0 \\Leftrightarrow x=0, x=1, x=-1$. Lập bảng xét dấu, ta thấy $y'$ đổi dấu từ $+$ sang $-$ khi qua $x=0$, nên hàm số đạt cực đại tại $x=0$. Giá trị cực đại $y(0) = 4$." },
            { part: 1, id: 9, type: "mcq", content: "Cho hàm số $y=f(x)$ liên tục và đồng biến trên $[1; 2]$. Khẳng định nào sau đây đúng.", options: ["Giá trị lớn nhất của hàm số là $f(2)$.", "Hàm số không có giá trị lớn nhất và nhỏ nhất trên $[1; 2]$.", "Hàm số đạt giá trị nhỏ nhất trên $[1; 2]$ tại $x=1$.", "Hàm số có giá trị nhỏ nhất nhưng không có giá trị lớn nhất trên $[1; 2]$."], correct: 2, explanation: "Vì hàm số $f(x)$ đồng biến trên đoạn $[1; 2]$ nên $f(1) \\le f(x) \\le f(2)$ với mọi $x \\in [1; 2]$. Do đó, hàm số đạt giá trị nhỏ nhất tại $x=1$." },
            { part: 1, id: 10, type: "mcq", content: "Hàm số nào dưới đây luôn nghịch biến trên $\\mathbb{R}$?", options: ["$y=\\dfrac{-2}{x+1}$.", "$y=3-2x-x^3$.", "$y=\\dfrac{x^2+x+3}{x+2}$.", "$y=\\dfrac{2x-2}{x+1}$."], correct: 1, explanation: "Hàm số cần tìm phải có tập xác định là $\\mathbb{R}$. Loại A, C, D vì chứa ẩn ở mẫu. Xét B: $y' = -2 - 3x^2 < 0, \\forall x \\in \\mathbb{R}$, vậy hàm số này luôn nghịch biến trên $\\mathbb{R}$." },
            { part: 1, id: 11, type: "mcq", content: "Cho hàm số $y=f(x)$ liên tục trên $\\mathbb{R}$ và có đạo hàm $f'(x)=x(x-1)^2(x+4)^3, \\forall x\\in\\mathbb{R}$. Số điểm cực trị của hàm số đã cho là:", options: ["$3$.", "$1$.", "$2$.", "$4$."], correct: 2, explanation: "Đạo hàm $f'(x) = 0$ có các nghiệm: $x=0$ (bội lẻ), $x=1$ (bội chẵn), $x=-4$ (bội lẻ). Đạo hàm chỉ đổi dấu khi đi qua các nghiệm bội lẻ. Vậy hàm số có 2 điểm cực trị." },
            { part: 1, id: 12, type: "mcq", content: "Cho hàm số $y=f(x)$ xác định trên đoạn $[-\\sqrt{3}; \\sqrt{5}]$ và có bảng biến thiên như hình vẽ.<br><br>" +

            // PHẦN II (4 CÂU ĐÚNG SAI)
            { part: 2, id: 13, type: "tf", content: "Cho hàm số $f(x)=\\dfrac{-x^2+x-2}{x+1}$ có đồ thị $(C)$. Xét tính đúng sai của các mệnh đề sau:<br><br>Mệnh đề:",
                statements: [
                    { text: "Đạo hàm của hàm số là $f'(x)=\\dfrac{-x^2-2x+3}{(x+1)^2}$.", correct: true, explanation: "Áp dụng công thức đạo hàm hàm phân thức: $f'(x) = \\dfrac{(-2x+1)(x+1) - (-x^2+x-2)\\cdot 1}{(x+1)^2} = \\dfrac{-2x^2-x+1 + x^2-x+2}{(x+1)^2} = \\dfrac{-x^2-2x+3}{(x+1)^2}$." },
                    { text: "Hàm số đồng biến trên khoảng $(1; +\\infty)$.", correct: false, explanation: "Cho $f'(x) = 0 \\Leftrightarrow -x^2-2x+3 = 0 \\Leftrightarrow x=1, x=-3$. Xét dấu $f'(x)$, trên khoảng $(1; +\\infty)$ thì $f'(x) < 0$, vậy hàm số nghịch biến." },
                    { text: "Đồ thị hàm số có tiệm cận xiên là đường thẳng $y=-x+2$.", correct: true, explanation: "Thực hiện phép chia đa thức: $\\dfrac{-x^2+x-2}{x+1} = -x + 2 - \\dfrac{4}{x+1}$. Do đó, đường tiệm cận xiên là $y=-x+2$." },
                    { text: "Đường thẳng đi qua hai điểm cực trị của đồ thị hàm số có phương trình là $y=-x+1$.", correct: false, explanation: "Đường thẳng đi qua hai điểm cực trị của hàm phân thức bậc 2 trên bậc 1 có phương trình là $y = \\dfrac{\\text{Đạo hàm tử}}{\\text{Đạo hàm mẫu}} = \\dfrac{-2x+1}{1} = -2x+1$. Mệnh đề sai." }
                ]
            },
            { part: 2, id: 14, type: "tf", content: "Cho hàm số $y=f(x)=ax^3+bx^2+cx+d$ có đồ thị như hình dưới đây:<br><br>" + getSvgP2Q2() + "<br>Xét tính đúng sai của các khẳng định sau:",
                statements: [
                    { text: "Hàm số đồng biến trên khoảng $(-1; +\\infty)$.", correct: false, explanation: "Dựa vào đồ thị, hàm số nghịch biến trên khoảng $(-1; 1)$, do đó khẳng định này sai." },
                    { text: "Hàm số đạt cực tiểu tại $x=1$.", correct: true, explanation: "Qua điểm có hoành độ $x=1$, đồ thị uốn từ đi xuống sang đi lên nên đây là điểm cực tiểu." },
                    { text: "Đồ thị hàm số cắt $Oy$ tại điểm có toạ độ $(0; 1)$.", correct: true, explanation: "Quan sát đồ thị, giao điểm với trục tung nằm tại tọa độ $(0, 1)$." },
                    { text: "Trong $4$ số $a, b, c, d$ có $3$ số dương.", correct: false, explanation: "Từ đồ thị, hình dáng chữ N $\\Rightarrow a > 0$. Cắt $Oy$ tại $(0, 1) \\Rightarrow d = 1 > 0$. Hai điểm cực trị là $x=-1, x=1$, theo định lý Vi-et $x_1+x_2 = -\\dfrac{2b}{3a} = 0 \\Rightarrow b=0$. $x_1 x_2 = \\dfrac{c}{3a} = -1 \\Rightarrow c < 0$. Chỉ có 2 số dương (a, d). Khẳng định sai." }
                ]
            },
            { part: 2, id: 15, type: "tf", content: "Cho hàm số $y=f(x)=x^4-2x^2+2$. Xét các mệnh đề sau:",
                statements: [
                    { text: "Hàm số đồng biến trên $(-\\infty; -1)$ và $(1; +\\infty)$.", correct: false, explanation: "Đạo hàm $f'(x) = 4x^3 - 4x = 0 \\Leftrightarrow x=0, x=\\pm 1$. Trên khoảng $(-\\infty; -1)$, $f'(x) < 0$ nên hàm số nghịch biến." },
                    { text: "Hàm số đạt cực đại tại $x=0$.", correct: true, explanation: "Đạo hàm đổi dấu từ $(+)$ sang $(-)$ khi qua $x=0$, nên $x=0$ là điểm cực đại." },
                    { text: "Hàm số nghịch biến trên $(0; 1)$.", correct: true, explanation: "Trên khoảng $(0; 1)$, lấy thử $x=0.5$ thì $f'(0.5) < 0$, nên hàm số nghịch biến." },
                    { text: "Giá trị lớn nhất của hàm số trên $(-1; 1)$ bằng $2$.", correct: true, explanation: "Trong khoảng $(-1; 1)$, điểm cực trị duy nhất là cực đại tại $x=0$. $f(0) = 2$. Đây chính là giá trị lớn nhất trên khoảng này." }
                ]
            },
            { part: 2, id: 16, type: "tf", content: "Để kỷ niệm 70 năm ngày thành lập trường THPT Việt Đức, các cựu học sinh tổ chức phát hành áo kỷ niệm gây quỹ học bổng. Giả sử doanh số (tính bằng số áo bán được) tuần theo quy luật logistic được mô hình hóa bằng hàm số $f(t)=\\dfrac{7000}{1+69e^{-t}}, t \\ge 0$, trong đó thời gian $t$ được tính theo đơn vị ngày, kể từ thời điểm ngày phát hành đầu tiên.",
                statements: [
                    { text: "Sau ba ngày kể từ thời điểm ngày phát hành đầu tiên, số áo bán ra vượt quá 2000 chiếc.", correct: false, explanation: "Tại $t=3$, $f(3) = \\dfrac{7000}{1+69e^{-3}} \\approx 1578$ chiếc. Số này nhỏ hơn 2000." },
                    { text: "Tổng số áo được bán ra không vượt quá 7000 chiếc.", correct: true, explanation: "Khi $t \\to +\\infty$, $e^{-t} \\to 0$, nên $\\lim\\limits_{t \\to +\\infty} f(t) = \\dfrac{7000}{1} = 7000$. Hàm số luôn đồng biến và bị chặn trên bởi $7000$." },
                    { text: "Ngay tại thời điểm ngày phát hành đầu tiên, số áo được bán ra đã đạt 100 chiếc.", correct: true, explanation: "Tại $t=0$, $f(0) = \\dfrac{7000}{1+69} = \\dfrac{7000}{70} = 100$ chiếc." },
                    { text: "Đạo hàm $f'(t)$ sẽ biểu thị tốc độ phát hành. Sau 360 giờ kể từ thời điểm phát hành đầu tiên thì tốc độ phát hành là lớn nhất.", correct: false, explanation: "Tốc độ phát hành lớn nhất khi $f''(t)=0 \\Leftrightarrow 1 = 69e^{-t} \\Leftrightarrow t = \\ln 69 \\approx 4,234$ ngày $\\approx 101,6$ giờ. Khẳng định 360 giờ (tức 15 ngày) là sai." }
                ]
            },

            // PHẦN III: TRẢ LỜI NGẮN (6 CÂU) - 0.5đ / câu
            { part: 3, id: 17, type: "short", content: "Biết đường thẳng đi qua hai điểm cực trị của đồ thị hàm số $y=-x^3+3x^2+9x+1$ là $ax+by+4=0$. Giá trị của biểu thức $a+2b$ bằng bao nhiêu?", correctAnswers: ["6"], explanation: "Đạo hàm $y' = -3x^2 + 6x + 9 = 0 \\Leftrightarrow x=-1, x=3$. Hai cực trị là $A(-1, -4)$ và $B(3, 28)$. Phương trình đường thẳng $AB$ là: $\\dfrac{x+1}{3+1} = \\dfrac{y+4}{28+4} \\Leftrightarrow 8x - y + 4 = 0$. Suy ra $a=8, b=-1$. Giá trị $a+2b = 8 + 2(-1) = 6$." },
            { part: 3, id: 18, type: "short", content: "Cho hàm số $f(x)=\\dfrac{ax+b}{2x+d} (a, b, d \\in \\mathbb{R})$. Biết rằng đồ thị hàm số đã cho đi qua điểm $(-1; 7)$ và giao điểm hai tiệm cận là $(-2; 3)$. Giá trị biểu thức $\\dfrac{2a+3b+d+8}{14}$ bằng bao nhiêu?", correctAnswers: ["6"], explanation: "Giao điểm 2 tiệm cận là $(-2; 3) \\Rightarrow$ TCĐ: $x = -d/2 = -2 \\Rightarrow d=4$. TCN: $y = a/2 = 3 \\Rightarrow a=6$. Đồ thị đi qua $(-1; 7) \\Rightarrow \\dfrac{6(-1)+b}{2(-1)+4} = 7 \\Rightarrow \\dfrac{-6+b}{2} = 7 \\Rightarrow b=20$. Tính giá trị: $\\dfrac{2(6)+3(20)+4+8}{14} = \\dfrac{12+60+12}{14} = \\dfrac{84}{14} = 6$." },
            { part: 3, id: 19, type: "short", content: "Cho hàm số $y=\\dfrac{mx+2025}{x+2}$ với $m$ là tham số. Có bao nhiêu số nguyên dương $m$ để hàm số đã cho nghịch biến trên các khoảng xác định?", correctAnswers: ["1012"], explanation: "Đạo hàm $y' = \\dfrac{2m-2025}{(x+2)^2}$. Để hàm số nghịch biến trên các khoảng xác định thì $y' < 0 \\Leftrightarrow 2m - 2025 < 0 \\Leftrightarrow m < 1012,5$. Do $m$ nguyên dương nên $m \\in \\{1, 2, ..., 1012\\}$. Vậy có 1012 giá trị." },
            { part: 3, id: 20, type: "short", content: "Một chất điểm chuyển động theo quy luật $S=-\\dfrac{1}{3}t^3+4t^2+9t \\text{ (m/s)}$ với $t \\ge 0$ là khoảng thời gian tính từ lúc vật bắt đầu chuyển động và $S$ là quãng đường vật chuyển động trong thời gian đó. Trong khoảng thời gian 10 giây kể từ lúc bắt đầu chuyển động, khoảng thời gian $(a; b)$ giây thì vận tốc của vật tăng. Tính $a+b$?", correctAnswers: ["4"], explanation: "Vận tốc $v(t) = S'(t) = -t^2 + 8t + 9$. Để vận tốc tăng thì gia tốc $a(t) = v'(t) > 0 \\Leftrightarrow -2t + 8 > 0 \\Leftrightarrow t < 4$. Vậy khoảng thời gian vận tốc tăng là $(0; 4)$. Ta có $a=0, b=4 \\Rightarrow a+b=4$." },
            { part: 3, id: 21, type: "short", content: "Một doanh nghiệp sản xuất $x$ sản phẩm trong một tháng $(x \\in \\mathbb{N}^*; 1 \\le x \\le 4000)$. Chi phí sản xuất bình quân cho mỗi sản phẩm (đơn vị: nghìn đồng) được cho bởi hàm $G(x)=2x+270$. Người ta xây dựng hàm doanh thu (đơn vị: nghìn đồng) của doanh nghiệp theo công thức $F(x) = x^3 - 10554x^2 + 37137870x - 43545500000$. Giả sử toàn bộ sản phẩm sản xuất ra đều được tiêu thụ. Hỏi doanh nghiệp cần sản xuất ít nhất bao nhiêu sản phẩm để lợi nhuận thu được lớn hơn hoặc bằng 100 triệu đồng?", correctAnswers: ["3456"], explanation: "Lợi nhuận $P(x) = F(x) - x \\cdot G(x) = x^3 - 10556x^2 + 37137600x - 43545500000$. Ta cần $P(x) \\ge 100,000$ (do đơn vị nghìn đồng). Giải BPT: $x^3 - 10556x^2 + 37137600x - 43545600000 \\ge 0$. Bấm máy tìm nghiệm phương trình bậc 3 ta được nghiệm duy nhất $x=3456$. Vậy cần sản xuất ít nhất 3456 sản phẩm." },
            { part: 3, id: 22, type: "short", content: "Một bồn chứa dầu được thiết kế với hai đầu là hai nửa hình cầu có bán kính $r$ (m) và phần thân ở giữa là một hình trụ có bán kính đáy $r$ (m) và chiều cao $h$ (m) (tham khảo hình vẽ dưới đây). Toàn bộ bồn chứa được yêu cầu có thể tích là $9\\pi \\text{ (m}^3\\text{)}$ và để đảm bảo tính ổn định trong quá trình vận chuyển, chiều cao $h$ của phần hình trụ phải thỏa mãn điều kiện $h \\ge 2$ (m). Chi phí để làm bồn phụ thuộc vào diện tích toàn bộ bề mặt ngoài của bồn (bao gồm mặt xung quanh của phần hình trụ và bề mặt của hai nửa hình cầu). Hãy xác định bán kính $r$ (m) để chi phí làm bồn là nhỏ nhất (viết kết quả ở dạng số thập phân).<br><br>" + getSvgP3Q6(), correctAnswers: ["1.5", "1,5"], explanation: "Thể tích $V = \\dfrac{4}{3}\\pi r^3 + \\pi r^2 h = 9\\pi \\Rightarrow h = \\dfrac{9}{r^2} - \\dfrac{4}{3}r$. Do $h \\ge 2 \\Rightarrow \\dfrac{9}{r^2} - \\dfrac{4}{3}r \\ge 2$. Diện tích bề mặt $S = 4\\pi r^2 + 2\\pi rh = 2\\pi(2r^2 + rh) = 2\\pi\\left(\\dfrac{2}{3}r^2 + \\dfrac{9}{r}\\right)$. Khảo sát hàm $f(r) = \\dfrac{2}{3}r^2 + \\dfrac{9}{r}$ trên miền điều kiện, ta thấy $f(r)$ đồng biến khi $r \\ge 1.88$. Tuy nhiên điều kiện $h \\ge 2$ chặn miền của r. Chi phí nhỏ nhất đạt được tại biên $h=2$, tức là $\\dfrac{4}{3}r^3 + 2r^2 - 9 = 0$. Giải PT ta được $r = 1,5$." }
        ];

        let currentQIndex = 0; 
        let answersState = new Array(22).fill(null); 
        for (let i = 12; i < 16; i++) { answersState[i] = [null, null, null, null]; }

        const appContainer = document.getElementById('appContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressText = document.getElementById('progressText');
        const scoreTracker = document.getElementById('scoreTracker');

        function updateTotalScore() {
            let total = 0;
            for (let i = 0; i < 12; i++) {
                if (answersState[i] && answersState[i].isCorrect) total += 0.25;
            }
            for (let i = 12; i < 16; i++) {
                let stList = answersState[i];
                let correctCount = 0;
                let answeredCount = 0;
                stList.forEach((userChoice, sIdx) => {
                    if (userChoice !== null) { 
                        answeredCount++; 
                        if (userChoice === questions[i].statements[sIdx].correct) correctCount++; 
                    }
                });
                if (answeredCount === 4) {
                    if (correctCount === 1) total += 0.1;
                    else if (correctCount === 2) total += 0.25;
                    else if (correctCount === 3) total += 0.5;
                    else if (correctCount === 4) total += 1.0;
                }
            }
            for (let i = 16; i < 22; i++) {
                if (answersState[i] && answersState[i].isCorrect) total += 0.5;
            }
            scoreTracker.innerText = `Điểm: ${total.toFixed(2)} / 10.0`;
        }

        function triggerMathRender() {
            renderMathInElement(appContainer, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ],
                throwOnError: false
            });
        }

        function renderQuestion(index) {
            const q = questions[index];
            let html = "";
            let badgeText = "";
            if (q.part === 1) badgeText = "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN (0.25đ/câu)";
            else if (q.part === 2) badgeText = "PHẦN II: TRẮC NGHIỆM ĐÚNG/SAI (Tối đa 1.0đ/câu)";
            else if (q.part === 3) badgeText = "PHẦN III: TRẮC NGHIỆM TRẢ LỜI NGẮN (0.5đ/câu)";
            
            let displayId = q.id;
            if (q.part === 2) displayId = q.id - 12;
            if (q.part === 3) displayId = q.id - 16;

            html += `
                <div class="mb-4 text-center">
                    <span class="part-badge shadow-sm">${badgeText}</span>
                </div>
                <div class="mb-6 fade-in">
                    <h2 class="text-2xl font-bold mb-4 text-blue-800">Câu ${displayId}:</h2>
                    <div class="mb-6 leading-relaxed">${q.content}</div>
            `;

            if (q.type === "mcq") {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                const letters = ['A', 'B', 'C', 'D'];
                q.options.forEach((opt, i) => {
                    let btnClass = "option-btn border-2 border-gray-300 rounded-lg p-4 text-left hover:bg-gray-50 flex items-center shadow-sm";
                    if (answersState[index]) {
                        if (i === q.correct) btnClass += " show-correct";
                        else if (answersState[index].selected === i) btnClass += " selected-wrong";
                        else btnClass += " opacity-50";
                    }
                    html += `<button class="${btnClass}" ${answersState[index] ? 'disabled' : `onclick="selectMCQ(${index}, ${i})"`}><span class="font-bold mr-3 text-blue-700">${letters[i]}.</span><span>${opt}</span></button>`;
                });
                html += `</div>`;
                if (answersState[index]) {
                    html += `<div class="mt-6 p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded shadow-sm"><h4 class="font-bold text-yellow-800 mb-1">Lời giải chi tiết:</h4><p class="text-yellow-900">${q.explanation}</p></div>`;
                }

            } else if (q.type === "tf") {
                html += `<div class="flex flex-col gap-4">`;
                const labels = ['a)', 'b)', 'c)', 'd)'];
                q.statements.forEach((stmt, i) => {
                    const userChoice = answersState[index][i]; 
                    
                    let btnDClass = "tf-btn";
                    let btnSClass = "tf-btn";
                    
                    if (userChoice !== null) {
                        if (stmt.correct === true) btnDClass += " correct-highlight";
                        else if (userChoice === true) btnDClass += " selected-wrong";
                        else btnDClass += " opacity-50";
                        
                        if (stmt.correct === false) btnSClass += " correct-highlight";
                        else if (userChoice === false) btnSClass += " selected-wrong";
                        else btnSClass += " opacity-50";
                    }

                    html += `
                        <div class="p-4 border rounded-xl bg-gray-50 flex flex-col gap-3 shadow-sm">
                            <div class="flex items-start gap-4">
                                <div class="flex gap-2">
                                    <button class="${btnDClass}" ${userChoice !== null ? 'disabled' : `onclick="selectTF(${index}, ${i}, true)"`}>Đ</button>
                                    <button class="${btnSClass}" ${userChoice !== null ? 'disabled' : `onclick="selectTF(${index}, ${i}, false)"`}>S</button>
                                </div>
                                <div class="flex-grow pt-2"><span class="font-bold mr-2 text-blue-700">${labels[i]}</span><span>${stmt.text}</span></div>
                            </div>
                    `;
                    
                    if (userChoice !== null) {
                        const isCorrect = (userChoice === stmt.correct);
                        const explPrefix = stmt.correct ? "Đúng vì: " : "Sai vì: ";
                        html += `<div class="mt-2 text-sm p-3 rounded-lg ${isCorrect ? 'bg-green-100 border border-green-200 text-green-900' : 'bg-red-100 border border-red-200 text-red-900'}"><span class="font-bold">${explPrefix}</span> ${stmt.explanation}</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;

            } else if (q.type === "short") {
                const ans = answersState[index];
                html += `
                    <div class="flex flex-col items-center gap-4 mt-6">
                        <input type="text" id="answerInput" class="answer-input shadow-sm" placeholder="Nhập đáp án..." autocomplete="off" ${ans !== null ? 'disabled' : ''} value="${ans ? ans.userAnswer : ''}">
                        ${ans === null ? `<button onclick="checkShort(${index})" class="check-btn shadow-md">Kiểm tra kết quả</button>` : ''}
                    </div>
                `;
                if (ans !== null) {
                    html += `
                        <div class="mt-8 p-5 rounded-xl border shadow-sm ${ans.isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}">
                            <h4 class="font-bold text-lg mb-2 ${ans.isCorrect ? 'text-green-800' : 'text-red-800'}">${ans.isCorrect ? '✓ BẠN ĐÃ TRẢ LỜI ĐÚNG!' : '✗ LỰA CHỌN SAI!'}</h4>
                            ${!ans.isCorrect ? `<p class="mb-3 font-semibold text-gray-700">Đáp án đúng là: <span class="text-blue-700">${q.correctAnswers[0]}</span></p>` : ''}
                            <hr class="my-3 border-gray-300"><h4 class="font-bold text-gray-800 mb-2">Lời giải chi tiết:</h4><p class="text-gray-700">${q.explanation}</p>
                        </div>
                    `;
                }
            }

            html += `</div>`;
            appContainer.innerHTML = html;
            progressText.innerText = `Câu ${index + 1} / ${questions.length}`;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;

            if (q.type === "short" && answersState[index] === null) setTimeout(() => document.getElementById('answerInput').focus(), 100);
            
            triggerMathRender();
        }

        window.selectMCQ = function(qIndex, optIndex) {
            if (answersState[qIndex]) return;
            answersState[qIndex] = { selected: optIndex, isCorrect: (optIndex === questions[qIndex].correct) };
            updateTotalScore(); renderQuestion(qIndex);
        }

        window.selectTF = function(qIndex, sIndex, userChoice) {
            if (answersState[qIndex][sIndex] !== null) return;
            answersState[qIndex][sIndex] = userChoice;
            updateTotalScore(); renderQuestion(qIndex);
        }

        window.checkShort = function(qIndex) {
            const inputVal = document.getElementById('answerInput').value.trim();
            if (inputVal === "") return alert("Vui lòng nhập đáp án!");
            const normalizedInput = inputVal.replace(/\s/g, '').replace(',', '.').toLowerCase();
            let isCorrect = questions[qIndex].correctAnswers.some(ans => normalizedInput === ans.replace(/\s/g, '').replace(',', '.').toLowerCase());
            answersState[qIndex] = { userAnswer: inputVal, isCorrect: isCorrect };
            updateTotalScore(); renderQuestion(qIndex);
        }

        prevBtn.addEventListener('click', () => { if (currentQIndex > 0) { currentQIndex--; renderQuestion(currentQIndex); } });
        nextBtn.addEventListener('click', () => { if (currentQIndex < questions.length - 1) { currentQIndex++; renderQuestion(currentQIndex); } });
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && questions[currentQIndex].type === "short" && answersState[currentQIndex] === null) {
                const activeEl = document.activeElement;
                if(activeEl && activeEl.id === 'answerInput') checkShort(currentQIndex);
            }
        });

        document.getElementById("loadingOverlay").style.display = "none";
        renderQuestion(currentQIndex);
    </script>
</body>
</html>
